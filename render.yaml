# PUPBC CareLink — Render Blueprint (Staging + Production)
#
# Completely isolated environments:
#   - STAGING (branch: staging) -> NEW Render Staging services + NEW Supabase Staging DB
#       Frontend: https://pupbc-carelink-staging.onrender.com
#       Backend:  https://pupbc-carelink-staging-api.onrender.com
#   - PRODUCTION (branch: main) -> NEW Render Production services + NEW Supabase Production DB
#       Frontend: https://pupbc-carelink-prod.onrender.com
#       Backend:  https://pupbc-carelink-prod-api.onrender.com
#   - LOCALHOST -> Local machine (XAMPP MySQL / Docker), never touches Render or Supabase.
#
# Full setup guide: docs/RENDER_DEPLOYMENT.md

services:
  # ===========================================================================
  # STAGING ENVIRONMENT (branch: staging -> Supabase Staging DB)
  # ===========================================================================
  - type: web
    name: pupbc-carelink-staging-api
    runtime: docker
    branch: staging
    region: singapore # Match Supabase Staging region (ap-southeast-1)
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: "PUPBC CareLink (Staging)"
      - key: APP_ENV
        value: staging
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false # secret: unique key for Staging (base64:...)
      - key: APP_URL
        value: https://pupbc-carelink-staging-api.onrender.com
      - key: FRONTEND_URL
        value: https://pupbc-carelink-staging.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      # NEW Supabase Staging DB (Session pooler on port 5432)
      - key: DB_CONNECTION
        value: pgsql
      - key: SUPABASE_DB_HOST
        sync: false # secret: Staging Supabase pooler host
      - key: SUPABASE_DB_PORT
        value: "5432"
      - key: SUPABASE_DB_DATABASE
        value: postgres
      - key: SUPABASE_DB_USERNAME
        sync: false # secret: postgres.<staging-project-ref>
      - key: SUPABASE_DB_PASSWORD
        sync: false # secret: Staging Supabase DB password
      - key: SUPABASE_DB_SSLMODE
        value: require
      - key: SUPABASE_DB_PERSISTENT
        value: "true"

      - key: JWT_SECRET
        sync: false # secret: unique JWT secret for Staging
      - key: JWT_TTL
        value: "1440"
      - key: KIOSK_DEVICE_TOKEN
        sync: false # secret: unique kiosk token for Staging

      # Brevo SMTP (port 2525; Render Free blocks 25/465/587)
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: pupbinancarelink@gmail.com
      - key: MAIL_FROM_NAME
        value: "PUPBC CareLink (Staging)"
      - key: MAIL_TIMEOUT
        value: "10"
      # Staging safety switch: reroute all outgoing emails to EMAIL_TEST_RECIPIENT.
      - key: EMAIL_TEST_MODE
        value: "true"
      - key: EMAIL_TEST_RECIPIENT
        value: delivered@resend.dev
      - key: NURSE_EMAIL_NOTIFICATIONS
        value: "false"

      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: "120"
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DRIVER
        value: local

      - key: SANCTUM_STATEFUL_DOMAINS
        value: pupbc-carelink-staging.onrender.com

      - key: SEED_NURSE_PASSWORD
        sync: false # secret: Staging nurse password

      - key: SLOT_MAX
        value: "10"
      - key: CLINIC_OPEN_TIME
        value: "08:00"
      - key: CLINIC_CLOSE_TIME
        value: "17:00"
      - key: LUNCH_START
        value: "12:00"
      - key: LUNCH_END
        value: "13:00"

      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: KIOSK_RATE_LIMIT
        value: "30"
      - key: AUTH_RATE_LIMIT
        value: "10"

      # AI Chatbot (Ollama + Gemini fallback)
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        value: "https://ollama.com/v1"
      - key: OLLAMA_MODEL
        value: "gemma4:31b"
      - key: OLLAMA_FALLBACK_MODELS
        value: "gemma4:31b"
      - key: OLLAMA_RATE_LIMIT_COOLDOWN
        value: "60"
      - key: OLLAMA_TIMEOUT
        value: "30"
      - key: OLLAMA_MAX_OUTPUT_TOKENS
        value: "1024"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
      - key: GEMINI_FALLBACK_MODELS
        value: "gemini-3.1-flash-lite,gemma-4-26b-a4b-it,gemma-4-31b-it"
      - key: GEMINI_TIMEOUT
        value: "20"
      - key: CHATBOT_ENABLED
        value: "true"
      - key: CHATBOT_RATE_LIMIT
        value: "5"
      - key: CHATBOT_DAILY_LIMIT
        value: "15"
      - key: CLINIC_EMAIL
        value: pupbinancarelink@gmail.com

  - type: web
    name: pupbc-carelink-staging
    runtime: static
    branch: staging
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://pupbc-carelink-staging-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: /api
      - key: VITE_APP_NAME
        value: "PUPBC CareLink (Staging)"
      - key: VITE_APP_ENV
        value: staging

  # ===========================================================================
  # PRODUCTION ENVIRONMENT (branch: main -> Supabase Production DB)
  # ===========================================================================
  - type: web
    name: pupbc-carelink-prod-api
    runtime: docker
    branch: main
    region: singapore # Match Supabase Production region (ap-southeast-1)
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: "PUPBC CareLink"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false # secret: unique key for Production (never reuse Staging key)
      - key: APP_URL
        value: https://pupbc-carelink-prod-api.onrender.com
      - key: FRONTEND_URL
        value: https://pupbc-carelink-prod.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

      # NEW Supabase Production DB (Session pooler on port 5432)
      - key: DB_CONNECTION
        value: pgsql
      - key: SUPABASE_DB_HOST
        sync: false # secret: Production Supabase pooler host
      - key: SUPABASE_DB_PORT
        value: "5432"
      - key: SUPABASE_DB_DATABASE
        value: postgres
      - key: SUPABASE_DB_USERNAME
        sync: false # secret: postgres.<prod-project-ref>
      - key: SUPABASE_DB_PASSWORD
        sync: false # secret: Production Supabase DB password
      - key: SUPABASE_DB_SSLMODE
        value: require
      - key: SUPABASE_DB_PERSISTENT
        value: "true"

      - key: JWT_SECRET
        sync: false # secret: unique JWT secret for Production
      - key: JWT_TTL
        value: "1440"
      - key: KIOSK_DEVICE_TOKEN
        sync: false # secret: unique kiosk token for Production

      # Brevo SMTP (port 2525; Render Free blocks 25/465/587)
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: pupbinancarelink@gmail.com
      - key: MAIL_FROM_NAME
        value: "PUPBC CareLink"
      - key: MAIL_TIMEOUT
        value: "10"
      - key: EMAIL_TEST_MODE
        value: "false"
      - key: EMAIL_TEST_RECIPIENT
        value: delivered@resend.dev
      - key: NURSE_EMAIL_NOTIFICATIONS
        value: "true"

      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: "120"
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DRIVER
        value: local

      - key: SANCTUM_STATEFUL_DOMAINS
        value: pupbc-carelink-prod.onrender.com

      - key: SEED_NURSE_PASSWORD
        sync: false # secret: strong Production nurse password

      - key: SLOT_MAX
        value: "10"
      - key: CLINIC_OPEN_TIME
        value: "08:00"
      - key: CLINIC_CLOSE_TIME
        value: "17:00"
      - key: LUNCH_START
        value: "12:00"
      - key: LUNCH_END
        value: "13:00"

      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: KIOSK_RATE_LIMIT
        value: "30"
      - key: AUTH_RATE_LIMIT
        value: "10"

      # AI Chatbot (Ollama + Gemini fallback)
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        value: "https://ollama.com/v1"
      - key: OLLAMA_MODEL
        value: "gemma4:31b"
      - key: OLLAMA_FALLBACK_MODELS
        value: "gemma4:31b"
      - key: OLLAMA_RATE_LIMIT_COOLDOWN
        value: "60"
      - key: OLLAMA_TIMEOUT
        value: "30"
      - key: OLLAMA_MAX_OUTPUT_TOKENS
        value: "1024"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
      - key: GEMINI_FALLBACK_MODELS
        value: "gemini-3.1-flash-lite,gemma-4-26b-a4b-it,gemma-4-31b-it"
      - key: GEMINI_TIMEOUT
        value: "20"
      - key: CHATBOT_ENABLED
        value: "true"
      - key: CHATBOT_RATE_LIMIT
        value: "5"
      - key: CHATBOT_DAILY_LIMIT
        value: "15"
      - key: CLINIC_EMAIL
        value: pupbinancarelink@gmail.com

  - type: web
    name: pupbc-carelink-prod
    runtime: static
    branch: main
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://pupbc-carelink-prod-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: /api
      - key: VITE_APP_NAME
        value: "PUPBC CareLink"
      - key: VITE_APP_ENV
        value: production
